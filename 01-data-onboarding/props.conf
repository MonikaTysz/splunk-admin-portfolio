# Splunk Indexer
# Example: Linux syslog event parsing

[linux_messages]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
TRUNCATE = 10000

# Example: E-commerce application logs
# Reference to transforms.conf masking rule

[ecommerce_app]
TRANSFORMS-mask_card = mask_card_number
