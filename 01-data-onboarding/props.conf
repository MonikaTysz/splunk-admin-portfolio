# Project: E-commerce Apache Web Server Log Onboarding
# Component: Splunk Indexer
#
# I configure event parsing based on Apache log samples.
# I use separate settings for access and error logs.

[access_combined]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = \[
TIME_FORMAT = %d/%b/%Y:%H:%M:%S %z
MAX_TIMESTAMP_LOOKAHEAD = 26

[apache_error]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^\[
TIME_FORMAT = %a %b %d %H:%M:%S.%6N %Y
MAX_TIMESTAMP_LOOKAHEAD = 40
