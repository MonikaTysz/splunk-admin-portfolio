# Project: E-commerce Apache Web Server Log Onboarding
# Component: Splunk Universal Forwarder
#
# I configure the Universal Forwarder to send
# Apache web server logs to my Splunk Indexer.
#
# I use a sample IP address for this portfolio project.

[tcpout]
defaultGroup = primary_indexers

[tcpout:primary_indexers]
server = 192.0.2.10:9997
