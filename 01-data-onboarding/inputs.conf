# Project: E-commerce Apache Web Server Log Onboarding
# Component: Splunk Universal Forwarder
#
# I monitor Apache access and error logs.
# I assign both log sources to the web index
# and use separate sourcetypes for each log format.

[monitor:///var/log/httpd/access_log]
disabled = 0
index = web
sourcetype = access_combined

[monitor:///var/log/httpd/error_log]
disabled = 0
index = web
sourcetype = apache_error
